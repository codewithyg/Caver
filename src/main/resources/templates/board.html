<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caver</title>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64," />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Load Font Awesome Icons -->
    <script src="https://kit.fontawesome.com/your-font-awesome-kit.js" crossorigin="anonymous"></script>
</head>

<body class="font-['Newsreader','Noto Sans',sans-serif] bg-slate-50 min-h-screen flex flex-col">
    <!-- Navigation Bar -->
    <div class="flex flex-col h-full">
        <header class="flex items-center justify-between border-b border-slate-200 px-4 py-3">
            <div class="flex items-center gap-4 text-slate-800">
                <div class="w-10 h-10">
                    <a href="/">
                        <img src="/img/Caver.png" alt="Logo" class="w-full h-full object-contain">
                    </a>
                </div>
                <a href="/" class="text-xl font-bold tracking-tight">Caver</a>
            </div>
            <!-- Hamburger Menu Button -->
            <button class="hamburger-btn text-slate-800 p-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                    viewBox="0 0 256 256">
                    <path
                        d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16ZM216,184H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z" />
                </svg>
            </button>
        </header>

        <!-- Hamburger Menu -->
        <nav class="hamburger-menu hidden fixed top-0 right-0 w-1/3 max-w-sm h-full bg-white shadow-lg p-6">
            <!-- Close Button -->
            <button class="close-btn hidden text-slate-800 absolute top-4 right-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                    viewBox="0 0 256 256">
                    <path
                        d="M208.49,191.51a8,8,0,0,1-11.32,11.32L128,133.32,58.83,202.49a8,8,0,0,1-11.32-11.32L116.68,128,47.51,58.83a8,8,0,0,1,11.32-11.32L128,122.68l69.17-69.17a8,8,0,0,1,11.32,11.32L139.32,128Z" />
                </svg>
            </button>
            <ul class="flex flex-col gap-4">
                <li>
                    <a href="#" class="text-lg font-medium toggle-news">뉴스</a>
                    <ul class="news-submenu hidden ml-4 mt-2">
                        <li><a href="/news" class="text-sm text-gray-600">전체뉴스</a></li>
                        <li><a href="/news/head" class="text-sm text-gray-600">헤드라인</a></li>
                    </ul>
                </li>
                <li><a href="/weather" class="text-lg font-medium">날씨</a></li>
                <li><a href="/stock" class="text-lg font-medium">증권</a></li>
                <li><a href="/board" class="text-lg font-medium">게시판</a></li>
            </ul>
        </nav>
    </div>

    <!-- 게시판 게시글 목록 -->
    <div class="container mx-auto p-4 max-w-full">
        <table class="w-full border-collapse border border-gray-300 text-left">
            <thead>
                <tr class="bg-gray-100 text-gray-700">
                    <th class="w-24 p-2 text-center">번호</th>
                    <th class="p-2 text-center">제목</th>
                    <th class="w-32 p-2 text-center">작성일자</th>
                    <th class="w-32 p-2 text-center">작성자</th>
                </tr>
            </thead>
            <tbody>
                <!-- 게시글 목록 -->
                <tr th:each="board : ${boards}" class="border-t border-gray-300">
                    <td class="text-center" th:text="${board.boardNo}"></td>
                    <td><a th:href="@{/board/{boardNo}(boardNo=${board.boardNo})}" th:text="${board.title}" class="text-blue-500"></a></td>
                    <td th:text="${#temporals.format(board.regDate, 'yyyy-MM-dd')}"></td>
                    <td th:text="${board.writer}"></td>
                </tr>
                <!-- 게시글이 없을 때 -->
                <tr th:if="${#lists.isEmpty(boards)}" class="border-t border-gray-300">
                    <td class="text-center">-</td>
                    <td colspan="3" class="text-center text-gray-500">게시글이 없습니다.</td>
                </tr>
            </tbody>
        </table>

        <!-- 페이징 처리 -->
        <div class="mt-8 flex justify-center">
            <div class="flex space-x-2 mr-40">
                <!-- 페이지 번호 버튼들 -->
                <span th:if="${totalPages > 0}" th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                    <a th:href="@{/board(page=${i})}" th:text="${i + 1}" 
                        th:class="${i == currentPage} ? 'px-4 py-2 border border-gray-300 rounded-md bg-gray-200' : 'px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-100'"></a>
                </span>
            </div>
        </div>

        <!-- 게시글 작성 버튼 -->
        <div class="mt-8 flex justify-end">
            <a href="/board/new" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 transition">글 작성</a>
        </div>
    </div>

    <script src="/js/menu.js"></script>
</body>
</html>

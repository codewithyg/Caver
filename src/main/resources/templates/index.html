<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caver</title>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64," />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Load Font Awesome Icons -->
    <script src="https://kit.fontawesome.com/your-font-awesome-kit.js" crossorigin="anonymous"></script>
</head>

<body class="font-['Newsreader','Noto Sans',sans-serif] bg-slate-50 min-h-screen flex flex-col">
    <!-- Navigation Bar -->
    <div class="flex flex-col h-full">
        <header class="flex items-center justify-between border-b border-slate-200 px-10 py-3">
            <div class="flex items-center gap-4 text-slate-800">
                <div class="w-4 h-4">
                    <svg viewBox="0 0 48 48" fill="currentColor">
                        <path d="M44 4H30.6666V17.3334H17.3334V30.6666H4V44H44V4Z" />
                    </svg>
                </div>
                <a href="/" class="text-lg font-bold tracking-tight">Caver</a>
            </div>
            <nav class="flex gap-8 ml-auto">
                <!-- Dropdown for News -->
                <div class="dropdown">
                    <a class="text-sm font-medium text-slate-800 cursor-pointer">뉴스</a>
                    <div class="dropdown-content">
                        <a href="/news">전체뉴스</a>
                        <a href="/news/head">헤드라인</a>
                    </div>
                </div>
                <!-- Other navigation links -->
                <a class="text-sm font-medium text-slate-800" href="/weather">날씨</a>
                <a class="text-sm font-medium text-slate-800" href="/stock">증권</a>
                <a class="text-sm font-medium text-slate-800" href="/community">게시판</a>
            </nav>
            <div class="flex items-center gap-2 ml-4">
                <button class="btn-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                        viewBox="0 0 256 256">
                        <path
                            d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16ZM216,184H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z" />
                    </svg>
                </button>
            </div>
        </header>
    </div>

    <!-- News Headlines Section -->
    <div class="news-section">
        <h2 class="text-xl text-center font-bold mb-4">주요 뉴스</h2>
        <div class="news-container grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- 3개의 헤드라인 뉴스만 출력 -->
            <div th:each="article : ${top3News}" class="bg-white shadow-md rounded-lg overflow-hidden">
                <img th:src="${article.urlToImage}" alt="뉴스 이미지"
                    onerror="this.onerror=null; this.src='/img/no-image-icon.png';" class="w-full h-48 object-cover">
                <div class="p-4">
                    <h2 th:text="${article.title}" class="text-lg font-semibold mb-2"></h2>
                    <p class="text-sm text-gray-500 mb-4">출처:
                        <span th:text="${article.sourceName}"></span>
                    </p>
                    <a th:href="${article.url}" target="_blank"
                        class="text-base font-semibold text-blue-500 hover:underline">기사 읽기</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Busan Weather Result Section -->
    <div class="weather-section">
        <div class="weather-container">
            <div class="flex items-center">
                <!-- 아이콘 컨테이너에 클래스 추가 -->
                <div class="weather-icon-container mr-4">
                    <!-- 날씨 아이콘 -->
                    <img th:src="'https://openweathermap.org/img/wn/' + ${weatherData.iconCode} + '@2x.png'"
                        alt="Weather Icon" class="weather-icon" />
                </div>
                <div>
                    <h2 class="text-2xl font-bold mb-4">
                        <span th:text="${weatherData.location}"></span>의 현재 날씨
                    </h2>
                    <p class="text-base font-semibold">날씨: <span th:text="${weatherData.description}"></span></p>
                    <p class="text-base font-semibold">온도: <span th:text="${weatherData.temperature}"></span>°C</p>
                    <p class="text-base font-semibold">체감 온도: <span th:text="${weatherData.feelsLike}"></span> °C</p>
                    <p class="text-base font-semibold">습도: <span th:text="${weatherData.humidity}"></span>%</p>
                    <p class="text-base font-semibold">풍속: <span th:text="${weatherData.windSpeed}"></span> m/s</p>
                </div>
            </div>
        </div>
    </div>

    <!-- NASDAQ Stock Section -->
    <div class="stock-section">
        <div class="stock-container p-4 border rounded mb-4 bg-white shadow-md">
            <h2 class="text-xl text-center font-bold mb-4">NASDAQ 주식</h2>
            <div class="p-4 border rounded mb-4 text-center"
                style="max-height: 400px; overflow-y: auto; background-color: #f9fafb;">
                <div th:each="stock : ${nasdaqStocks}">
                    <div class="mb-4 p-4 border-b border-slate-300">
                        <h3 class="text-lg font-semibold" th:text="${stock.name}"></h3>
                        <p th:text="'Symbol: ' + ${stock.symbol}"></p>
                        <!--<p th:text="'Price: $' + ${stock.price}"></p>-->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/menu.js"></script>
</body>

</html>

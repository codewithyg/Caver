<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caver</title>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64," />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://kit.fontawesome.com/your-font-awesome-kit.js" crossorigin="anonymous"></script>
</head>

<!-- 날씨 정보 페이지 /weather -->
<body class="font-['Newsreader','Noto Sans',sans-serif] bg-slate-50 min-h-screen flex flex-col">
    <!-- 네비게이션 바 -->
    <div class="flex flex-col h-full">
        <header class="flex items-center justify-between border-b border-slate-200 px-4 py-3">
            <div class="flex items-center gap-4 text-slate-800">
                <div class="w-10 h-10">
                    <a href="/">
                        <img src="/img/Caver.png" alt="Logo" class="w-full h-full object-contain">
                    </a>
                </div>
                <a href="/" class="text-xl font-bold tracking-tight">Caver</a>
            </div>
            <!-- 햄버거 메뉴 (닫혔을 때) -->
            <button class="hamburger-btn text-slate-800 p-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                    viewBox="0 0 256 256">
                    <path
                        d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16ZM216,184H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z" />
                </svg>
            </button>
        </header>

        <!-- 햄버거 메뉴 (열렸을 때) -->
        <nav class="hamburger-menu hidden fixed top-0 right-0 w-1/3 max-w-sm h-full bg-white shadow-lg p-6">
            <!-- 햄버거 메뉴 닫기 버튼 -->
            <button class="close-btn hidden text-slate-800 absolute top-4 right-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                    viewBox="0 0 256 256">
                    <path
                        d="M208.49,191.51a8,8,0,0,1-11.32,11.32L128,133.32,58.83,202.49a8,8,0,0,1-11.32-11.32L116.68,128,47.51,58.83a8,8,0,0,1,11.32-11.32L128,122.68l69.17-69.17a8,8,0,0,1,11.32,11.32L139.32,128Z" />
                </svg>
            </button>
            <ul class="flex flex-col gap-4">
                <li>
                    <a href="#" class="text-lg font-medium toggle-news">뉴스</a>
                    <ul class="news-submenu hidden ml-4 mt-2">
                        <li><a href="/news" class="text-sm text-gray-600">국내뉴스</a></li>
                        <li><a href="/global-news" class="text-sm text-gray-600">해외뉴스</a></li>
                    </ul>
                </li>
                <li><a href="/weather" class="text-lg font-medium">날씨</a></li>
                <li><a href="/stock" class="text-lg font-medium">증권</a></li>
                <li><a href="/board" class="text-lg font-medium">게시판</a></li>
            </ul>
        </nav>
    </div>

    <!-- 날씨 에러 처리 -->
    <script src="/js/weatherError.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error') && urlParams.get('error') === 'true') {
            showErrorAlert("도시를 다시 검색해주세요");
        }
    </script>

    <!-- 날씨 검색 폼 -->
    <div class="p-4">
        <form action="/weather" method="GET" class="search-form">
            <input type="text" name="city" placeholder="도시 이름을 입력하세요" class="search-input" required>
            <button type="submit" class="search-button">검색</button>
        </form>
    </div>

    <!-- 현재 날씨 섹션 -->
    <section class="weather-section p-6">
        <div class="flex items-center">
            <div id="weather-icon" class="weather-icon-container mr-4">
                <img th:src="'https://openweathermap.org/img/wn/' + ${weatherData?.iconCode} + '@2x.png'"
                    alt="Weather Icon" class="weather-icon" />
            </div>
            <div>
                <h2 class="text-2xl font-bold mb-4"><span th:text="${city}"></span>의 현재 날씨</h2>
                <p class="text-base font-semibold">날씨: <span th:text="${weatherData.description}"></span></p>
                <p class="text-base font-semibold">온도: <span th:text="${weatherData.temperature}"></span>°C</p>
                <p class="text-base font-semibold">습도: <span th:text="${weatherData.humidity}"></span>%</p>
                <p class="text-base font-semibold">풍속: <span th:text="${weatherData.windSpeed}"></span> m/s</p>
                <p class="text-base font-semibold">체감 온도: <span th:text="${weatherData.feelsLike}"></span> °C</p>
            </div>
        </div>
    </section>

    <!-- 일기예보 섹션 -->
    <section class="forecast-section p-6 mt-8">
        <h2 class="text-2xl font-bold mb-4 text-center">일기예보(12시 기준)</h2>
        <div class="forecast-grid grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            <div th:each="forecast : ${forecastData}" class="forecast-card bg-slate-100 p-4 rounded-lg text-center">
                <p class="text-lg font-semibold" th:text="${forecast.dateTime}"></p>
                <div class="forecast-icon-container mx-auto my-2">
                    <img th:src="'http://openweathermap.org/img/wn/' + ${forecast.iconCode} + '@2x.png'"
                        alt="Forecast Icon" class="forecast-icon" />
                </div>
                <p class="text-base font-semibold" th:text="'날씨: ' + ${forecast.description}"></p>
                <p class="text-base font-semibold" th:text="'온도: ' + ${forecast.temp} + '°C'"></p>
                <p class="text-base font-semibold" th:text="'풍속: ' + ${forecast.windSpeed} + 'm/s'"></p>
                <p class="text-base font-semibold" th:text="'습도: ' + ${forecast.humidity} + '%'"></p>
            </div>
        </div>
    </section>

    <!-- 햄버거 메뉴를 위한 JS 파일 -->
    <script src="/js/menu.js"></script>
</body>

</html>

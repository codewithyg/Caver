<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caver</title>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64," />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Load Font Awesome Icons -->
    <script src="https://kit.fontawesome.com/your-font-awesome-kit.js" crossorigin="anonymous"></script>
</head>

<body class="font-['Newsreader','Noto Sans',sans-serif] bg-slate-50 min-h-screen flex flex-col">
    <!-- Navigation Bar -->
    <div class="flex flex-col h-full">
        <header class="flex items-center justify-between border-b border-slate-200 px-10 py-3">
            <div class="flex items-center gap-4 text-slate-800">
                <div class="w-4 h-4">
                    <svg viewBox="0 0 48 48" fill="currentColor">
                        <path d="M44 4H30.6666V17.3334H17.3334V30.6666H4V44H44V4Z" />
                    </svg>
                </div>
                <a href="/" class="text-lg font-bold tracking-tight">Caver</a>
            </div>
            <nav class="flex gap-8 ml-auto">
                <a class="text-sm font-medium text-slate-800" href="/news">뉴스</a>
                <a class="text-sm font-medium text-slate-800" href="/weather">날씨</a>
                <a class="text-sm font-medium text-slate-800" href="/stock">증권</a>
                <a class="text-sm font-medium text-slate-800" href="/community">게시판</a>
            </nav>
            <div class="flex items-center gap-2 ml-4">
                <!--
                <button class="btn-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                        viewBox="0 0 256 256">
                        <path
                            d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24ZM74.08,197.5a64,64,0,0,1,107.84,0,87.83,87.83,0,0,1-107.84,0ZM96,120a32,32,0,1,1,32,32A32,32,0,0,1,96,120Zm97.76,66.41a79.66,79.66,0,0,0-36.06-28.75,48,48,0,1,0-59.4,0,79.66,79.66,0,0,0-36.06,28.75,88,88,0,1,1,131.52,0Z" />
                    </svg>
                </button>
                -->
                <button class="btn-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                        viewBox="0 0 256 256">
                        <path
                            d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16ZM216,184H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z" />
                    </svg>
                </button>
            </div>
        </header>
    </div>

    <script src="/js/weatherError.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error') && urlParams.get('error') === 'true') {
            showErrorAlert("도시를 다시 검색해주세요");
        }
    </script>

    <!-- Weather Search Form -->
    <div class="p-4">
        <form action="/weather" method="GET" class="search-form">
            <input type="text" name="city" placeholder="도시 이름을 입력하세요" class="search-input" required>
            <button type="submit" class="search-button">검색</button>
        </form>
    </div>

    <!-- Weather Result Section -->
    <section class="weather-section p-6">
        <div class="flex items-center">
            <div id="weather-icon" class="mr-4">
                <img th:src="'https://openweathermap.org/img/wn/' + ${weatherData?.iconCode} + '@2x.png'" alt="Weather Icon"/>
            </div>
            <div>
                <h2 class="text-2xl font-bold mb-4"><span th:text="${weatherData.location}"></span>의 현재 날씨</h2>
                <p class="text-base font-semibold">날씨: <span th:text="${weatherData.description}"></span></p>
                <p class="text-base font-semibold">온도: <span th:text="${weatherData.temperature}"></span>°C</p>
                <p class="text-base font-semibold">습도: <span th:text="${weatherData.humidity}"></span>%</p>
                <p class="text-base font-semibold">풍속: <span th:text="${weatherData.windSpeed}"></span> m/s</p>
                <p class="text-base font-semibold">체감 온도: <span th:text="${weatherData.feelsLike}"></span> °C</p>
            </div>
        </div>
    </section>

    <!-- Forecast Result Section -->
    <section class="forecast-section p-6 mt-8">
        <h2 class="text-xl font-bold mb-4">일기예보</h2>
        <div class="forecast-grid grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            <div th:each="forecast : ${forecastData}" class="forecast-card bg-slate-100 p-4 rounded-lg text-center">
                <p class="text-lg font-semibold" th:text="${forecast.dateTime}"></p>
                <img th:src="'http://openweathermap.org/img/wn/' + ${forecast.iconCode} + '@2x.png'" alt="Forecast Icon" class="mx-auto my-2"/>
                <p class="text-base font-semibold" th:text="'날씨: ' + ${forecast.description}"></p>
                <p class="text-base font-semibold" th:text="'예상온도: ' + ${forecast.temperature} + '°C'"></p>
                <p class="text-base font-semibold" th:text="'체감온도: ' + ${forecast.feelsLike} + '°C'"></p>
                <p class="text-base font-semibold" th:text="'습도: ' + ${forecast.humidity} + '%'"></p>
            </div>
        </div>
    </section>
</body>
</html>

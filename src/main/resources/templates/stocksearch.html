<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caver</title>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64," />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://kit.fontawesome.com/your-font-awesome-kit.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<!-- 주식 검색 결과 페이지 /stock/search -->
<body class="font-['Newsreader','Noto Sans',sans-serif] bg-slate-50 min-h-screen flex flex-col">
    <!-- 네비게이션 바 -->
    <div class="flex flex-col h-full">
        <header class="flex items-center justify-between border-b border-slate-200 px-4 py-3">
            <div class="flex items-center gap-4 text-slate-800">
                <div class="w-10 h-10">
                    <a href="/">
                        <img src="/img/Caver.png" alt="Logo" class="w-full h-full object-contain">
                    </a>
                </div>
                <a href="/" class="text-xl font-bold tracking-tight">Caver</a>
            </div>
            <!-- 햄버거 메뉴 (닫혔을 때) -->
            <button class="hamburger-btn text-slate-800 p-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                    viewBox="0 0 256 256">
                    <path
                        d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16ZM216,184H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z" />
                </svg>
            </button>
        </header>

        <!-- 햄버거 메뉴 (열렸을 때) -->
        <nav class="hamburger-menu hidden fixed top-0 right-0 w-1/3 max-w-sm h-full bg-white shadow-lg p-6">
            <!-- 햄버거 메뉴 닫기 버튼 -->
            <button class="close-btn hidden text-slate-800 absolute top-4 right-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                    viewBox="0 0 256 256">
                    <path
                        d="M208.49,191.51a8,8,0,0,1-11.32,11.32L128,133.32,58.83,202.49a8,8,0,0,1-11.32-11.32L116.68,128,47.51,58.83a8,8,0,0,1,11.32-11.32L128,122.68l69.17-69.17a8,8,0,0,1,11.32,11.32L139.32,128Z" />
                </svg>
            </button>
            <ul class="flex flex-col gap-4">
                <li>
                    <a href="#" class="text-lg font-medium toggle-news">뉴스</a>
                    <ul class="news-submenu hidden ml-4 mt-2">
                        <li><a href="/news" class="text-sm text-gray-600">국내뉴스</a></li>
                        <li><a href="/global-news" class="text-sm text-gray-600">해외뉴스</a></li>
                    </ul>
                </li>
                <li><a href="/weather" class="text-lg font-medium">날씨</a></li>
                <li><a href="/stock" class="text-lg font-medium">증권</a></li>
                <li><a href="/board" class="text-lg font-medium">게시판</a></li>
            </ul>
        </nav>
    </div>

    <!-- 검색 폼 -->
    <div class="p-6">
        <form action="/stock/search" method="GET" class="stock-search-form flex gap-4">
            <input type="text" name="query" placeholder="Symbol을 입력하세요"
                class="search-input flex-1 border border-gray-300 rounded px-4 py-2" required>
            <button type="submit" class="search-button bg-blue-500 text-white px-4 py-2 rounded">검색</button>
        </form>
    </div>

    <!-- 설명 섹션 -->
    <div class="p-6">
        <h2 class="text-xl text-center font-bold mb-4">검색 결과</h2>
        <div class="p-4 border rounded mb-4 text-center bg-gray-100">
            <div th:if="${searchResults.isEmpty()}">
                <p>검색 결과가 없습니다.</p>
            </div>
            <div th:each="stock : ${searchResults}">
                <h3 class="text-lg font-semibold" th:text="${stock.name}"></h3>
                <p th:text="'Symbol: ' + ${stock.symbol}"></p>
                <p th:text="'Price: $' + ${stock.price}"></p>
            </div>
        </div>
    </div>

    <!-- 차트 섹션 -->
    <div class="p-6">
        <h2 class="text-xl text-center font-bold mb-4">차트</h2>
        <div th:if="${chartData.isEmpty()}">
            <p>차트 데이터를 불러올 수 없습니다.</p>
        </div>
        <div th:unless="${chartData.isEmpty()}">
            <!-- Chart.js 캔버스 -->
            <canvas id="stockChart" width="400" height="200"></canvas>

            <!-- Chart.js 내용 -->
            <script th:inline="javascript">
                // Thymeleaf 데이터를 JavaScript로 변환
                const chartData = /*[[${chartData}]]*/ [];
                
                // 날짜와 종가 데이터 추출
                const labels = chartData.map(data => data.date);
                const prices = chartData.map(data => data.close);

                // Chart.js로 라인 차트 생성
                const ctx = document.getElementById('stockChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: '주가 (종가)',
                            data: prices,
                            borderColor: 'rgba(75, 192, 192, 1)',
                            backgroundColor: 'rgba(75, 192, 192, 0.2)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        scales: {
                            x: {
                                title: { display: true, text: '날짜' },
                                reverse: true
                            },
                            y: {
                                title: { display: true, text: '가격 (USD)' }
                            }
                        }
                    }
                });
            </script>
        </div>
    </div>

    <!-- 햄버거 메뉴를 위한 JS 파일 -->
    <script src="/js/menu.js"></script>
</body>

</html>

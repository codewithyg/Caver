<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caver</title>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64," />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://kit.fontawesome.com/your-font-awesome-kit.js" crossorigin="anonymous"></script>
</head>

<!-- 게시판 상세 페이지 /board/게시글번호 -->
<body class="font-['Newsreader','Noto Sans',sans-serif] bg-slate-50 min-h-screen flex flex-col">
    <!-- 네비게이션 바 -->
    <div class="flex flex-col h-full">
        <header class="flex items-center justify-between border-b border-slate-200 px-4 py-3">
            <div class="flex items-center gap-4 text-slate-800">
                <div class="w-10 h-10">
                    <a href="/">
                        <img src="/img/Caver.png" alt="Logo" class="w-full h-full object-contain">
                    </a>
                </div>
                <a href="/" class="text-xl font-bold tracking-tight">Caver</a>
            </div>
            <!-- 햄버거 메뉴 (닫혔을 때) -->
            <button class="hamburger-btn text-slate-800 p-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                    viewBox="0 0 256 256">
                    <path
                        d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16ZM216,184H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z" />
                </svg>
            </button>
        </header>

        <!-- 햄버거 메뉴 (열렸을 때) -->
        <nav class="hamburger-menu hidden fixed top-0 right-0 w-1/3 max-w-sm h-full bg-white shadow-lg p-6">
            <!-- 햄버거 메뉴 닫기 버튼 -->
            <button class="close-btn hidden text-slate-800 absolute top-4 right-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                    viewBox="0 0 256 256">
                    <path
                        d="M208.49,191.51a8,8,0,0,1-11.32,11.32L128,133.32,58.83,202.49a8,8,0,0,1-11.32-11.32L116.68,128,47.51,58.83a8,8,0,0,1,11.32-11.32L128,122.68l69.17-69.17a8,8,0,0,1,11.32,11.32L139.32,128Z" />
                </svg>
            </button>
            <ul class="flex flex-col gap-4">
                <li>
                    <a href="#" class="text-lg font-medium toggle-news">뉴스</a>
                    <ul class="news-submenu hidden ml-4 mt-2">
                        <li><a href="/news" class="text-sm text-gray-600">전체뉴스</a></li>
                        <li><a href="/news/head" class="text-sm text-gray-600">헤드라인</a></li>
                    </ul>
                </li>
                <li><a href="/weather" class="text-lg font-medium">날씨</a></li>
                <li><a href="/stock" class="text-lg font-medium">증권</a></li>
                <li><a href="/board" class="text-lg font-medium">게시판</a></li>
            </ul>
        </nav>
    </div>

    <!-- 게시판 게시글 상세 -->
    <div class="container mx-auto p-4">
        <h2 class="text-2xl font-bold mb-4">게시글 상세</h2>
        <div class="border border-gray-300 p-4 bg-gray-50">
            <!-- 게시글 번호 -->
            <div>
                <div class="text-left text-sm text-gray-600">
                    <strong>게시글 번호: </span></strong>
                    <span th:text="${board.boardNo}">
                </div>

                <!-- 게시글 제목 -->
                <div class="text-center text-3xl font-bold">
                    <span th:text="${board.title}"></span>
                </div>
            </div>

            <!-- 작성일자와 작성자 -->
            <div class="text-right text-sm text-gray-600 mt-2">
                <div>
                    <strong>작성일자:</strong>
                    <span th:text="${#temporals.format(board.regDate, 'yyyy-MM-dd')}"></span>
                </div>
                <div>
                    <strong>작성자:</strong>
                    <span th:text="${board.writer}"></span>
                </div>
            </div>

            <!-- 게시글 내용 -->
            <div class="mt-6 text-center text-lg font-bold">
                <p class="whitespace-pre-line" th:text="${board.content}"></p>
            </div>

            <!-- 비밀번호 입력란과 수정/삭제 버튼 -->
            <div class="mt-40 text-right space-y-2">
                <form method="post" class="inline-block">
                    <!-- 비밀번호 입력란 -->
                    <input type="password" id="password" name="password" required class="border p-1 w-1/4 text-sm"
                        placeholder="비밀번호 입력">

                    <!-- 수정 버튼 (POST 요청) -->
                    <button type="submit" class="bg-blue-500 text-white px-3 py-1 rounded text-sm font-bold" formaction="#"
                        formmethod="post" th:formaction="@{/board/updatecontent/{boardNo}(boardNo=${board.boardNo})}">
                        수정
                    </button>

                    <!-- 삭제 버튼 (POST 요청) -->
                    <button type="submit" class="bg-red-500 text-white px-3 py-1 rounded text-sm font-bold" formaction="#"
                        formmethod="post" th:formaction="@{/board/delete/{boardNo}(boardNo=${board.boardNo})}">
                        삭제
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- 게시판 목록으로 -->
    <div class="mt-4 text-right mr-72 font-bold">
        <a href="/board" class="bg-gray-500 text-white px-3 py-1 rounded text-sm">
            목록
        </a>
    </div>

    <script th:if="${errorMessage != null}">
        /*<![CDATA[*/
        alert(/*[[${errorMessage}]]*/);
        /*]]>*/
    </script>

    <!-- 햄버거 메뉴를 위한 JS 파일 -->
    <script src="/js/menu.js"></script>
</body>

</html>
